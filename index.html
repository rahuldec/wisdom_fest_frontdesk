<title>Wisdom Student Images</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="okie-dokie.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --green: #0f4a25;
  --green-mid: #146031;
  --gold: #dbb13b;
  --bg: #f1f5f1;
  --card: #ffffff;
  --text: #1a2e1d;
  --muted: #5a7060;
  --border: #dce8de;
  --shadow: 0 20px 50px -12px rgba(0,0,0,0.15);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1f0e; --card: #122018; --text: #e4ede5;
    --muted: #7a9c80; --border: #1e3626; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1f0e; --card: #122018; --text: #e4ede5;
  --muted: #7a9c80; --border: #1e3626; color-scheme: dark;
}

*,*::before,*::after { box-sizing: border-box; }
body {
  margin: 0; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; overflow-x: hidden;
}

.band { display: none; }

.page {
  position: relative; z-index: 1; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding-top: 28px; padding-bottom: 56px; gap: 20px;
}

/* Site header — prominent, diagonal band */
.appbar {
  width: 100%;
  background: linear-gradient(135deg, var(--green) 0%, #1a5c30 60%, var(--green-mid) 100%);
  clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%);
  padding: 28px max(28px, env(safe-area-inset-left, 0px)) 64px;
  padding-right: max(28px, env(safe-area-inset-right, 0px));
}
.appbar-inner {
  max-width: 860px; margin: 0 auto;
  display: flex; align-items: center; gap: 22px;
}
.appbar-brand { display: flex; align-items: center; gap: 22px; }
.appbar-logo {
  width: 88px; height: 88px; border-radius: 22px;
  background: #fff; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.12);
}
.appbar-logo img { width: 72px; height: 72px; object-fit: contain; display: block; }
.appbar-text { display: flex; flex-direction: column; gap: 3px; }
.appbar-title {
  color: #fff; font-size: 1.9rem; font-weight: 800; letter-spacing: -.03em;
  line-height: 1.1; margin: 0;
}
.appbar-sub {
  color: rgba(255,255,255,.82); font-size: .9rem; font-weight: 600;
  letter-spacing: -.01em;
}
.appbar-dev {
  color: rgba(255,255,255,.55); font-size: .76rem; font-weight: 500;
}

/* Footer */
.footer {
  display: flex; align-items: center; gap: 8px;
  font-size: .74rem; color: var(--muted); font-weight: 500;
  letter-spacing: .01em; padding-top: 4px;
}
.footer-logo {
  width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
  box-shadow: 0 1px 6px rgba(0,0,0,.12);
}

/* Search card */
.s-card {
  background: var(--card); border-radius: 24px; padding: 22px 20px;
  width: 100%; max-width: 860px; box-shadow: var(--shadow); position: relative;
}

.s-card::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 64px; height: 4px; background: var(--gold); border-radius: 0 0 4px 4px;
}
.s-label {
  display: block; font-size: .67rem; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
}
.s-wrap { position: relative; }
.s-ico {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.s-input {
  width: 100%; height: 48px; padding: 0 42px; border: 2px solid var(--border);
  border-radius: 12px; font-size: .97rem; font-family: inherit; font-weight: 500;
  background: var(--bg); color: var(--text); outline: none; transition: border-color .18s;
}
.s-input:focus { border-color: var(--green); }
.s-input::placeholder { color: var(--muted); font-weight: 400; }
.x-btn {
  position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--muted);
  display: flex; align-items: center; padding: 4px; border-radius: 6px;
}
.x-btn:hover { color: var(--text); }
.sync {
  display: flex; align-items: center; gap: 6px;
  font-size: .7rem; color: var(--muted); font-weight: 500; margin-top: 9px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.dot.spin { background: var(--gold); }
.dot.err  { background: #ef4444; animation: none; }

/* Results */
.results { width: 100%; max-width: 860px; }

/* Empty / no-result */
.empty {
  background: var(--card); border-radius: 22px; text-align: center;
  padding: 52px 24px; box-shadow: 0 4px 20px rgba(0,0,0,.06);
}
.empty-icon {
  width: 68px; height: 68px; border-radius: 18px;
  background: linear-gradient(135deg, var(--green), var(--green-mid));
  display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
}
.empty h2 { margin: 0 0 7px; font-size: 1.2rem; font-weight: 700; }
.empty p  { margin: 0 auto; color: var(--muted); font-size: .88rem; line-height: 1.55; max-width: 250px; }
.count-pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(15,74,37,.1); color: var(--green);
  border-radius: 8px; padding: 4px 10px; font-size: .7rem; font-weight: 700; margin-top: 12px;
}

/* ── Profile card ── */
.pcard { background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }

/* compact header */
.phead {
  background: linear-gradient(135deg, var(--green) 0%, var(--green-mid) 100%);
  padding: 18px 22px 26px; position: relative;
}
.phead::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
  height: 18px; background: var(--card); border-radius: 18px 18px 0 0;
}
.gold-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gold); }
.prow1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.badge {
  background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.28);
  border-radius: 8px; padding: 2px 10px; font-size: .68rem; font-weight: 700;
  letter-spacing: .05em; color: #fff; text-transform: uppercase;
}
.badge.gold { background: var(--gold); border-color: var(--gold); color: #3a2600; }
.pname { color: #fff; font-size: 1.55rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -.02em; }
.ptags { display: flex; gap: 6px; flex-wrap: wrap; }
.ptag  { background: rgba(255,255,255,.12); color: rgba(255,255,255,.88); border-radius: 5px; padding: 2px 9px; font-size: .72rem; font-weight: 600; }
.ptag.g { background: var(--gold); color: #3a2600; }

/* body */
.pbody { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 18px; }

.sec-title {
  font-size: .63rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--green); display: flex; align-items: center; gap: 7px; margin-bottom: 12px;
}
.sec-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── PHOTO GRID: card style ── */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
}
.photo-card {
  background: var(--card); border-radius: 14px; overflow: hidden;
  box-shadow: 0 2px 14px rgba(0,0,0,.08); border: 1px solid var(--border);
  cursor: pointer; transition: box-shadow .2s, transform .2s;
}
.photo-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.14); transform: translateY(-2px); }
.photo-card.no-click { cursor: default; }
.photo-card.no-click:hover { transform: none; box-shadow: 0 2px 14px rgba(0,0,0,.08); }
.photo-card-img {
  width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;
  transition: transform .25s;
}
.photo-card:hover .photo-card-img { transform: scale(1.04); }
.photo-card-placeholder {
  width: 100%; aspect-ratio: 3/4;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; background: var(--bg); color: var(--muted);
}
.photo-card-placeholder svg { opacity: .35; }
.photo-card-placeholder span { font-size: .72rem; font-weight: 500; }
.photo-card-info { padding: 10px 12px 12px; }
.photo-card-role {
  font-size: .72rem; font-weight: 700; color: var(--gold);
  text-transform: uppercase; letter-spacing: .06em;
}
.photo-card-name {
  font-size: .82rem; font-weight: 600; color: var(--text);
  margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.photo-card-sub { font-size: .7rem; color: var(--muted); margin-top: 2px; }

/* sibling section */
.sib-card {
  background: var(--bg); border-radius: 14px; padding: 14px 16px;
  border: 1.5px solid var(--border);
}
.sib-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sib-name { font-weight: 700; font-size: .9rem; }
.sib-id   { font-size: .7rem; color: var(--muted); margin-top: 2px; }
.same-badge {
  font-size: .63rem; font-weight: 700; padding: 3px 10px; border-radius: 20px;
  background: #dcfce7; color: #166534;
}
.same-badge.n { background: #fee2e2; color: #991b1b; }

/* lightbox */
.lbox {
  display: none; position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,.92); align-items: center; justify-content: center; padding: 16px;
}
.lbox.open { display: flex; }
.lbox img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 8px; }
.lbox-close {
  position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,.12);
  border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%;
  cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
}
.lbox-lbl {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.55); color: #fff; padding: 5px 14px;
  border-radius: 20px; font-size: .8rem; font-weight: 500; white-space: nowrap;
}
</style>

<div class="appbar">
  <div class="appbar-inner">
    <div class="appbar-brand">
      <div class="appbar-logo">
        <img src="logo.jpg" alt="Wisdom World School">
      </div>
      <div class="appbar-text">
        <div class="appbar-title">Student Images</div>
        <div class="appbar-sub">Wisdom World School</div>
        <div class="appbar-dev">Developed by Okie Dokie</div>
      </div>
    </div>
  </div>
</div>

<div class="page">

  <div class="s-card">
    <span class="s-label">Find a Student</span>
    <div class="s-wrap">
      <svg class="s-ico" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input class="s-input" id="q" type="search" placeholder="Name or Scholar ID…" autocomplete="off" spellcheck="false">
      <button class="x-btn" id="xbtn" hidden aria-label="Clear">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="sync">
      <span class="dot spin" id="dot"></span>
      <span id="stxt">Loading…</span>
    </div>
  </div>

  <div class="results" id="results"></div>
  <div class="footer">
    <img class="footer-logo" src="okie-dokie.png" alt="Okie Dokie">
    Crafted with ❤️ by Okie Dokie
  </div>
</div>

<div class="lbox" id="lbox">
  <button class="lbox-close" id="lclose">✕</button>
  <img id="limg" src="" alt="">
  <div class="lbox-lbl" id="llbl"></div>
</div>

<script>
const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQzj10zwC7xD3vlSy5Ee9h2iLrCgsr-XQSv_ROYW1xdXAOoS3yt9luTu0g2rh4VTlHb84aeXTy0Ou37/pub?output=csv';
const INTERVAL = 30000;
let students = [];

function parseCSV(txt) {
  const rows = []; let cur = [], f = '', inQ = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (c === '"') { if (inQ && txt[i+1]==='"') { f+='"'; i++; } else inQ=!inQ; }
    else if (c === ',' && !inQ) { cur.push(f.trim()); f = ''; }
    else if ((c==='\n'||c==='\r') && !inQ) {
      cur.push(f.trim()); rows.push(cur); cur=[]; f='';
      if (c==='\r' && txt[i+1]==='\n') i++;
    } else f += c;
  }
  cur.push(f.trim()); rows.push(cur);
  return rows;
}

function thumbUrl(url) {
  const m = url && url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=s400` : null;
}
function fullUrl(url) {
  const m = url && url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=s1200` : null;
}

function rowTo(r) {
  return {
    addedTime:r[0], appId:r[2], scholarId:r[3], name:r[4],
    course:r[5], stream:r[6], section:r[7],
    father:{name:r[8],photo:r[9]}, mother:{name:r[10],photo:r[11]},
    guardian:{photo:r[12]},
    grandfather:{name:r[13],photo:r[14]}, grandmother:{name:r[15],photo:r[16]},
    sib1:{same:r[17],name:r[18],id:r[19],photo:r[20],aadhar:r[21]},
    sib2:{same:r[22],name:r[23],id:r[24],photo:r[25],aadhar:r[26]}
  };
}

async function fetchData() {
  const dot = document.getElementById('dot'), stxt = document.getElementById('stxt');
  dot.className = 'dot spin';
  try {
    const res = await fetch(CSV + '&_=' + Date.now());
    const txt = await res.text();
    const rows = parseCSV(txt);
    students = rows.slice(1).filter(r => r[4] && r[4].trim()).map(rowTo);
    dot.className = 'dot';
    const t = new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
    stxt.textContent = `${students.length} students · synced ${t}`;
    render(document.getElementById('q').value);
  } catch(e) {
    dot.className = 'dot err';
    stxt.textContent = 'Sync failed · retrying…';
  }
}

const NO_IMG = `<div class="photo-card-placeholder"><svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/></svg><span>No Image</span></div>`;

window.imgErr = function(img) {
  const card = img.closest('.photo-card');
  if (!card) return;
  img.replaceWith(document.createRange().createContextualFragment(NO_IMG));
  card.classList.add('no-click');
  card.onclick = null;
};

function photoCard(photoUrl, role, name, sub) {
  const t = thumbUrl(photoUrl), f = fullUrl(photoUrl);
  const lbl = (role + (name ? ' – ' + name : '')).replace(/'/g, '&#39;');
  const info = `<div class="photo-card-info">
    <div class="photo-card-role">${role}</div>
    ${name ? `<div class="photo-card-name">${name}</div>` : ''}
    ${sub  ? `<div class="photo-card-sub">${sub}</div>`   : ''}
  </div>`;
  if (!t) {
    return `<div class="photo-card no-click">${NO_IMG}${info}</div>`;
  }
  return `<div class="photo-card" onclick="lb('${f}','${lbl}')">
    <img class="photo-card-img" src="${t}" alt="${role}" loading="lazy" onerror="imgErr(this)">
    ${info}
  </div>`;
}

function sibEl(s) {
  if (!s.name && !s.same) return '';
  if (s.same === 'No Sibling') return '';
  const cards = [
    photoCard(s.photo,  'Photo',  s.name, s.id ? 'ID: ' + s.id : ''),
    s.aadhar ? photoCard(s.aadhar, 'Aadhar', s.name, s.id ? 'ID: ' + s.id : '') : ''
  ].filter(Boolean).join('');
  return `<div class="sib-card">
    <div class="sib-head">
      <div>
        <div class="sib-name">${s.name || '—'}</div>
        ${s.id ? `<div class="sib-id">${s.id}</div>` : ''}
      </div>
      <span class="same-badge${s.same==='Yes' ? '' : ' n'}">${s.same==='Yes' ? '✓ Same school' : 'Other school'}</span>
    </div>
    ${cards ? `<div class="photo-grid">${cards}</div>` : ''}
  </div>`;
}

function studentEl(s) {
  const familyPhotos = [
    photoCard(s.father.photo,      'Father',      s.father.name, ''),
    photoCard(s.mother.photo,      'Mother',      s.mother.name, ''),
    s.grandfather.photo ? photoCard(s.grandfather.photo, 'Grandfather', s.grandfather.name, '') : '',
    s.grandmother.photo ? photoCard(s.grandmother.photo, 'Grandmother', s.grandmother.name, '') : '',
    s.guardian.photo    ? photoCard(s.guardian.photo,    'Guardian',    '',                  '') : ''
  ].filter(Boolean).join('');

  const sibs = [sibEl(s.sib1), sibEl(s.sib2)].filter(Boolean).join('');

  return `<div class="pcard">
    <div class="phead">
      <div class="gold-bar"></div>
      <div class="prow1">
        <span class="badge">${s.scholarId}</span>
        <span class="badge gold">${s.appId}</span>
      </div>
      <div class="pname">${s.name}</div>
      <div class="ptags">
        <span class="ptag g">${s.course}</span>
        ${s.stream && s.stream !== s.course ? `<span class="ptag">${s.stream}</span>` : ''}
        <span class="ptag">${s.section}</span>
        <span class="ptag" style="opacity:.7;font-weight:500">${s.addedTime.split(' ')[0]}</span>
      </div>
    </div>
    <div class="pbody">
      <div>
        <div class="sec-title">Family Photographs</div>
        <div class="photo-grid">${familyPhotos}</div>
      </div>
      ${sibs ? `<div><div class="sec-title">Siblings</div><div style="display:flex;flex-direction:column;gap:12px">${sibs}</div></div>` : ''}
    </div>
  </div>`;
}

function render(query) {
  const area = document.getElementById('results');
  const q = (query || '').trim().toLowerCase();
  if (!q) {
    area.innerHTML = `<div class="empty">
      <div class="empty-icon">
        <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
        </svg>
      </div>
      <h2>Search students</h2>
      <p>Type a name or scholar ID to view family photos</p>
      ${students.length ? `<div class="count-pill">● ${students.length} records loaded</div>` : ''}
    </div>`;
    return;
  }
  const hits = students.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.scholarId.toLowerCase().includes(q) ||
    s.appId.toLowerCase().includes(q)
  );
  if (!hits.length) {
    area.innerHTML = `<div class="empty">
      <div class="empty-icon" style="background:#6b7280">
        <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/>
        </svg>
      </div>
      <h2>No results</h2>
      <p>No student matched "<strong>${query}</strong>".</p>
    </div>`;
    return;
  }
  area.innerHTML = hits.map(studentEl).join('<div style="height:14px"></div>');
}

window.lb = (src, lbl) => {
  document.getElementById('limg').src = src;
  document.getElementById('llbl').textContent = lbl;
  document.getElementById('lbox').classList.add('open');
};
document.getElementById('lclose').onclick = () => document.getElementById('lbox').classList.remove('open');
document.getElementById('lbox').onclick = e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); };

const qi = document.getElementById('q'), xb = document.getElementById('xbtn');
qi.addEventListener('input', () => { xb.hidden = !qi.value; render(qi.value); });
xb.onclick = () => { qi.value = ''; xb.hidden = true; render(''); qi.focus(); };

fetchData();
setInterval(fetchData, INTERVAL);
</script>
