<title>Wisdom Student Images</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --green: #0f4a25;
  --green-mid: #146031;
  --gold: #dbb13b;
  --bg: #f1f5f1;
  --card: #ffffff;
  --text: #1a2e1d;
  --muted: #5a7060;
  --border: #dce8de;
  --shadow: 0 20px 50px -12px rgba(0,0,0,0.15);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1f0e; --card: #122018; --text: #e4ede5;
    --muted: #7a9c80; --border: #1e3626; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1f0e; --card: #122018; --text: #e4ede5;
  --muted: #7a9c80; --border: #1e3626; color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box;}
body {
  margin:0; font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  background:var(--bg); color:var(--text); min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; overflow-x:hidden;
}

.band {
  position:fixed; top:0; left:0; right:0; height:46vh; z-index:0;
  background:linear-gradient(160deg,var(--green) 0%,var(--green-mid) 100%);
  clip-path:polygon(0 0,100% 0,100% 72%,0 100%);
}

.page {
  position:relative; z-index:1; min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding-top:36px; padding-bottom:56px; gap:20px;
}

/* ── Header ── */
.hdr { text-align:center; color:#fff; }
.logo {
  width:72px; height:72px; background:#fff; border-radius:20px;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 14px;
  box-shadow:0 8px 28px rgba(0,0,0,0.22),0 0 0 6px rgba(255,255,255,0.14);
}
.hdr h1 { margin:0 0 5px; font-size:1.9rem; font-weight:800; letter-spacing:-0.02em; }
.hdr p  { margin:0; font-size:0.9rem; opacity:0.82; font-weight:500; }

/* ── Search card ── */
.s-card {
  background:var(--card); border-radius:28px; padding:28px 24px;
  width:100%; max-width:500px; box-shadow:var(--shadow); position:relative;
}
.s-card::before {
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:72px; height:4px; background:var(--gold); border-radius:0 0 4px 4px;
}
.s-label {
  display:block; font-size:0.68rem; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); margin-bottom:9px;
}
.s-wrap { position:relative; }
.s-wrap svg.ico {
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color:var(--muted); pointer-events:none;
}
.s-input {
  width:100%; height:50px; padding:0 44px; border:2px solid var(--border);
  border-radius:13px; font-size:.97rem; font-family:inherit; font-weight:500;
  background:var(--bg); color:var(--text); outline:none;
  transition:border-color .18s;
}
.s-input:focus { border-color:var(--green); }
.s-input::placeholder { color:var(--muted); font-weight:400; }
.x-btn {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; color:var(--muted);
  display:flex; align-items:center; padding:4px; border-radius:6px;
}
.x-btn:hover { color:var(--text); }

.sync {
  display:flex; align-items:center; gap:6px;
  font-size:.72rem; color:var(--muted); font-weight:500; margin-top:10px;
}
.dot {
  width:7px; height:7px; border-radius:50%; background:#22c55e;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.dot.spin { background:var(--gold); }
.dot.err  { background:#ef4444; animation:none; }

/* ── Results ── */
.results { width:100%; max-width:780px; }

/* empty / no-result */
.empty {
  background:var(--card); border-radius:24px; text-align:center;
  padding:60px 24px; box-shadow:0 4px 20px rgba(0,0,0,.06);
}
.empty-icon {
  width:76px; height:76px; border-radius:20px;
  background:linear-gradient(135deg,var(--green),var(--green-mid));
  display:flex; align-items:center; justify-content:center; margin:0 auto 18px;
}
.empty h2 { margin:0 0 8px; font-size:1.25rem; font-weight:700; }
.empty p  { margin:0; color:var(--muted); font-size:.9rem; line-height:1.55; max-width:260px; margin:0 auto; }
.count-pill {
  display:inline-flex; align-items:center; gap:5px;
  background:rgba(15,74,37,.1); color:var(--green);
  border-radius:8px; padding:4px 10px; font-size:.72rem; font-weight:700; margin-top:14px;
}

/* ── Profile card ── */
.pcard { background:var(--card); border-radius:24px; overflow:hidden; box-shadow:var(--shadow); }

.phead {
  background:linear-gradient(135deg,var(--green) 0%,var(--green-mid) 100%);
  padding:26px 26px 30px; position:relative; overflow:hidden;
}
.phead::after {
  content:''; position:absolute; bottom:-1px; left:0; right:0;
  height:22px; background:var(--card); border-radius:22px 22px 0 0;
}
.gold-top { position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold); }

.pbadges { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.badge {
  background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.28);
  border-radius:9px; padding:3px 11px; font-size:.72rem; font-weight:700;
  letter-spacing:.05em; color:#fff; text-transform:uppercase;
}
.badge.gold { background:var(--gold); border-color:var(--gold); color:#3a2600; }

.pname { color:#fff; font-size:1.75rem; font-weight:800; margin:0 0 10px; letter-spacing:-.02em; }
.ptags { display:flex; gap:7px; flex-wrap:wrap; }
.ptag  { background:rgba(255,255,255,.12); color:rgba(255,255,255,.9); border-radius:6px; padding:3px 10px; font-size:.76rem; font-weight:600; }
.ptag.g { background:var(--gold); color:#3a2600; }

.pbody { padding:22px 24px 28px; display:flex; flex-direction:column; gap:26px; }

.sec-title {
  font-size:.67rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--green); display:flex; align-items:center; gap:8px; margin-bottom:13px;
}
.sec-title::after { content:''; flex:1; height:1px; background:var(--border); }

/* photo grid */
.pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
.pitem { display:flex; flex-direction:column; gap:5px; }
.pframe {
  aspect-ratio:3/4; background:var(--bg); border-radius:11px; overflow:hidden;
  border:1.5px solid var(--border); cursor:pointer; position:relative;
}
.pframe img { width:100%; height:100%; object-fit:cover; transition:transform .3s; display:block; }
.pframe:hover img { transform:scale(1.05); }
.ph-empty {
  width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:5px; color:var(--muted);
}
.ph-empty svg { opacity:.45; }
.ph-empty span { font-size:.68rem; }
.plabel  { font-size:.73rem; font-weight:600; color:var(--muted); text-align:center; }
.psubl   { font-size:.65rem; color:var(--muted); text-align:center; opacity:.75; margin-top:-2px; }

/* sibling */
.sib-card {
  background:var(--bg); border-radius:13px; padding:15px;
  border:1.5px solid var(--border);
}
.sib-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
.sib-name { font-weight:700; font-size:.93rem; }
.sib-id   { font-size:.72rem; color:var(--muted); margin-top:1px; }
.same-badge {
  font-size:.67rem; font-weight:700; padding:2px 9px; border-radius:20px;
  background:#dcfce7; color:#166534;
}
.same-badge.n { background:#fee2e2; color:#991b1b; }

/* details */
.dgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; }
.ditem { background:var(--bg); border-radius:10px; padding:11px 13px; border:1px solid var(--border); }
.dkey  { font-size:.65rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.dval  { font-size:.88rem; font-weight:600; margin-top:2px; }

/* lightbox */
.lbox {
  display:none; position:fixed; inset:0; z-index:2000;
  background:rgba(0,0,0,.92); align-items:center; justify-content:center; padding:20px;
}
.lbox.open { display:flex; }
.lbox img { max-width:100%; max-height:88vh; object-fit:contain; border-radius:8px; }
.lbox-close {
  position:absolute; top:16px; right:16px; background:rgba(255,255,255,.12);
  border:none; color:#fff; width:40px; height:40px; border-radius:50%;
  cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center;
}
.lbox-lbl {
  position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.55); color:#fff; padding:5px 16px;
  border-radius:20px; font-size:.83rem; font-weight:500; white-space:nowrap;
}

@media(max-width:480px){
  .pname{font-size:1.4rem}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .dgrid{grid-template-columns:1fr 1fr}
}
</style>

<div class="band"></div>
<div class="page">

  <div class="hdr">
    <div class="logo">
      <img src="logo.jpg" alt="Wisdom World School" style="width:60px;height:60px;object-fit:contain;">
    </div>
    <h1>Student Images</h1>
    <p>Wisdom World School · 2026–27</p>
  </div>

  <div class="s-card">
    <span class="s-label">Find a Student</span>
    <div class="s-wrap">
      <svg class="ico" width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input class="s-input" id="q" type="search" placeholder="Name or Scholar ID…" autocomplete="off" spellcheck="false">
      <button class="x-btn" id="xbtn" hidden aria-label="Clear">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="sync">
      <span class="dot spin" id="dot"></span>
      <span id="stxt">Loading…</span>
    </div>
  </div>

  <div class="results" id="results"></div>
</div>

<div class="lbox" id="lbox">
  <button class="lbox-close" id="lclose">✕</button>
  <img id="limg" src="" alt="">
  <div class="lbox-lbl" id="llbl"></div>
</div>

<script>
const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQzj10zwC7xD3vlSy5Ee9h2iLrCgsr-XQSv_ROYW1xdXAOoS3yt9luTu0g2rh4VTlHb84aeXTy0Ou37/pub?output=csv';
const INTERVAL = 30000;
let students = [];

/* ── CSV parser ── */
function parseCSV(txt) {
  const rows = []; let cur = [], f = '', inQ = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (c === '"') { if (inQ && txt[i+1]==='"') { f+='"'; i++; } else inQ=!inQ; }
    else if (c === ',' && !inQ) { cur.push(f.trim()); f = ''; }
    else if ((c==='\n'||c==='\r') && !inQ) {
      cur.push(f.trim()); rows.push(cur); cur=[]; f='';
      if (c==='\r' && txt[i+1]==='\n') i++;
    } else f += c;
  }
  cur.push(f.trim()); rows.push(cur);
  return rows;
}

function thumb(url, size='w400') {
  const m = url && url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=s${size==='w400'?'400':'1200'}` : null;
}

function rowTo(r) {
  return {
    addedTime:r[0], appId:r[2], scholarId:r[3], name:r[4],
    course:r[5], stream:r[6], section:r[7],
    father:{name:r[8],photo:r[9]}, mother:{name:r[10],photo:r[11]},
    guardian:{photo:r[12]},
    grandfather:{name:r[13],photo:r[14]}, grandmother:{name:r[15],photo:r[16]},
    sib1:{same:r[17],name:r[18],id:r[19],photo:r[20],aadhar:r[21]},
    sib2:{same:r[22],name:r[23],id:r[24],photo:r[25],aadhar:r[26]}
  };
}

async function fetchData() {
  const dot=document.getElementById('dot'), stxt=document.getElementById('stxt');
  dot.className='dot spin';
  try {
    const res = await fetch(CSV+'&_='+Date.now());
    const txt = await res.text();
    const rows = parseCSV(txt);
    students = rows.slice(1).filter(r=>r[4]&&r[4].trim()).map(rowTo);
    dot.className='dot';
    const t=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    stxt.textContent=`${students.length} students · synced ${t}`;
    render(document.getElementById('q').value);
  } catch(e) {
    dot.className='dot err';
    stxt.textContent='Sync failed · retrying…';
  }
}

/* ── Photo card ── */
function photoEl(url, label, sub) {
  const t = thumb(url), t2 = thumb(url,'w1200');
  return `<div class="pitem">
    <div class="pframe"${t?` onclick="lb('${t2}','${label}${sub?' – '+sub:''}')"`:''}>
      ${t
        ? `<img src="${t}" alt="${label}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=ph-empty><svg width=24 height=24 fill=none viewBox=\"0 0 24 24\" stroke=currentColor stroke-width=1.5><path stroke-linecap=round stroke-linejoin=round d=\"M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0\"/></svg><span>No photo</span></div>'">`
        : `<div class="ph-empty"><svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/></svg><span>No photo</span></div>`}
    </div>
    <div class="plabel">${label}</div>
    ${sub?`<div class="psubl">${sub}</div>`:''}
  </div>`;
}

function sibEl(s, n) {
  if (!s.name && !s.same) return '';
  if (s.same==='No Sibling') return '';
  const photos = [
    s.photo ? photoEl(s.photo, `Sibling ${n}`, s.name) : '',
    s.aadhar ? photoEl(s.aadhar, 'Aadhar', `Sibling ${n}`) : ''
  ].join('');
  return `<div class="sib-card">
    <div class="sib-head">
      <div>
        <div class="sib-name">${s.name||'—'}</div>
        ${s.id?`<div class="sib-id">${s.id}</div>`:''}
      </div>
      <span class="same-badge${s.same==='Yes'?'':' n'}">${s.same==='Yes'?'✓ Same school':'Other school'}</span>
    </div>
    ${photos?`<div class="pgrid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr))">${photos}</div>`:''}
  </div>`;
}

function studentEl(s) {
  const photos = [
    s.father.photo    ? photoEl(s.father.photo,    'Father',      s.father.name)      : photoEl('','Father',     s.father.name||''),
    s.mother.photo    ? photoEl(s.mother.photo,    'Mother',      s.mother.name)      : photoEl('','Mother',     s.mother.name||''),
    s.grandfather.photo ? photoEl(s.grandfather.photo,'Grandfather',s.grandfather.name) : '',
    s.grandmother.photo ? photoEl(s.grandmother.photo,'Grandmother',s.grandmother.name) : '',
    s.guardian.photo  ? photoEl(s.guardian.photo, 'Guardian',    '')                 : ''
  ].join('');

  const sibs = [sibEl(s.sib1,1), sibEl(s.sib2,2)].filter(Boolean).join('');

  const det = [
    ['Scholar ID', s.scholarId], ['Application', s.appId],
    ['Grade', s.course], ['Section', s.section],
    s.father.name   ? ['Father',      s.father.name]      : null,
    s.mother.name   ? ['Mother',      s.mother.name]      : null,
    s.grandfather.name ? ['Grandfather', s.grandfather.name] : null,
    s.grandmother.name ? ['Grandmother', s.grandmother.name] : null,
    ['Submitted', s.addedTime]
  ].filter(Boolean).map(([k,v])=>
    `<div class="ditem"><div class="dkey">${k}</div><div class="dval" style="font-size:${k==='Submitted'?'.78rem':'.88rem'}">${v}</div></div>`
  ).join('');

  return `<div class="pcard">
    <div class="phead">
      <div class="gold-top"></div>
      <div class="pbadges">
        <span class="badge">${s.scholarId}</span>
        <span class="badge gold">${s.appId}</span>
      </div>
      <div class="pname">${s.name}</div>
      <div class="ptags">
        <span class="ptag g">${s.course}</span>
        ${s.stream&&s.stream!==s.course?`<span class="ptag">${s.stream}</span>`:''}
        <span class="ptag">${s.section}</span>
      </div>
    </div>
    <div class="pbody">
      <div>
        <div class="sec-title">Family Photographs</div>
        <div class="pgrid">${photos}</div>
      </div>
      ${sibs?`<div><div class="sec-title">Siblings</div><div style="display:flex;flex-direction:column;gap:11px">${sibs}</div></div>`:''}
      <div>
        <div class="sec-title">Details</div>
        <div class="dgrid">${det}</div>
      </div>
    </div>
  </div>`;
}

function render(query) {
  const area = document.getElementById('results');
  const q = (query||'').trim().toLowerCase();
  if (!q) {
    area.innerHTML = `<div class="empty">
      <div class="empty-icon">
        <svg width="34" height="34" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
        </svg>
      </div>
      <h2>Search students</h2>
      <p>Type a name or scholar ID to view family photos and details</p>
      ${students.length?`<div class="count-pill">● ${students.length} records loaded</div>`:''}
    </div>`;
    return;
  }
  const hits = students.filter(s=>
    s.name.toLowerCase().includes(q) ||
    s.scholarId.toLowerCase().includes(q) ||
    s.appId.toLowerCase().includes(q)
  );
  if (!hits.length) {
    area.innerHTML=`<div class="empty">
      <div class="empty-icon" style="background:#6b7280">
        <svg width="34" height="34" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/>
        </svg>
      </div>
      <h2>No results</h2>
      <p>No student matched "<strong>${query}</strong>". Try a different name or scholar ID.</p>
    </div>`;
    return;
  }
  area.innerHTML = hits.map(studentEl).join('<div style="height:16px"></div>');
}

/* lightbox */
window.lb = (src,lbl) => {
  document.getElementById('limg').src = src;
  document.getElementById('llbl').textContent = lbl;
  document.getElementById('lbox').classList.add('open');
};
document.getElementById('lclose').onclick = () => document.getElementById('lbox').classList.remove('open');
document.getElementById('lbox').onclick = e => { if(e.target===e.currentTarget) e.currentTarget.classList.remove('open'); };

/* search */
const qi = document.getElementById('q'), xb = document.getElementById('xbtn');
qi.addEventListener('input', () => {
  xb.hidden = !qi.value;
  render(qi.value);
});
xb.onclick = () => { qi.value=''; xb.hidden=true; render(''); qi.focus(); };

fetchData();
setInterval(fetchData, INTERVAL);
</script>
